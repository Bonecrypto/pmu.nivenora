<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Inter; font-weight: 100 900; src: url('../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2'); unicode-range: U+0000-00FF, U+2000-206F; }
@font-face { font-family: Inter; font-weight: 100 900; src: url('../node_modules/@fontsource-variable/inter/files/inter-latin-ext-wght-normal.woff2') format('woff2'); unicode-range: U+0100-024F; }
@font-face { font-family: Inter; font-weight: 100 900; src: url('../node_modules/@fontsource-variable/inter/files/inter-cyrillic-wght-normal.woff2') format('woff2'); unicode-range: U+0400-04FF; }
* { box-sizing: border-box; margin: 0; }
body { width: 1200px; height: 630px; background: #fbf8f4; color: #2a2320; font-family: Inter, system-ui, sans-serif; display: flex; overflow: hidden; }
.photo { width: 500px; height: 630px; object-fit: cover; object-position: 50% 30%; }
.right { flex: 1; padding: 56px 60px 44px; display: flex; flex-direction: column; }
.mark { width: 44px; height: 44px; margin-right: 14px; }
.brand { display: flex; align-items: center; font-weight: 700; font-size: 32px; letter-spacing: -0.02em; }
.brand span { font-weight: 500; font-size: 15px; letter-spacing: .2em; color: #6b5f58; margin-left: 6px; }
h1 { font-weight: 700; font-size: 52px; line-height: 1.1; letter-spacing: -0.025em; margin-top: 34px; }
.sub { font-size: 24px; color: #6b5f58; margin-top: 18px; }
.works { display: flex; gap: 10px; margin-top: auto; }
.works img { width: 120px; height: 120px; object-fit: cover; border-radius: 10px; }
.price { margin-left: auto; align-self: flex-end; background: #8a4f41; color: #fff; font-weight: 700; font-size: 22px; padding: 12px 20px; border-radius: 999px; white-space: nowrap; }
</style></head>
<body>
<img class="photo" src="../src/assets/veronika/veronika.jpg">
<div class="right">
  <div class="brand"><img class="mark" src="../public/favicon.svg" alt="">Veronika <span>PMU</span></div>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <div class="works">
    <img src="../src/assets/portfolio/usta-przed-po-01.jpg">
    <img src="../src/assets/portfolio/brwi-usta-01.jpg">
    <img src="../src/assets/portfolio/usta-02.jpg">
    <div class="price" id="price"></div>
  </div>
</div>
<script>
const q = new URLSearchParams(location.search);
for (const k of ['title','sub','price']) document.getElementById(k).textContent = q.get(k);
</script>
</body></html>
